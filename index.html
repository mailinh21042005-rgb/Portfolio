<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" 
            content="width=device-width, initial-scale=1.0">
        <title>Nguyễn Thị Mai Linh - Portfolio</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>  
        <header class="site-header">
            <a class="logo" href="#">Mai Linh</a>
            <nav class="site-nav">
                <ul>
                    <li><a href="#about">Giới thiệu</a></li>
                    <li><a href="#projects">Dự án</a></li>
                    <li><a href="#contact">Liên hệ</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="about">
                <h1>Nguyễn Thị Mai Linh</h1>
                <p>Hiiii. I'm Mei Ling and welcome to my portfolio!</p>
                <img src="me.jpg" alt="Ảnh chân dung của Ling-san">
            </section>

            <section id="projects">
                <h2>Dự án</h2>
                <article>
                    <h3>Phát triển game Asteroids</h3>
                    <p>C++, 2025.</p>
                </article>

                <article>
                    <h3>Phát triển hệ thống phân loại bệnh trên lá lúa sử dụng SVC, KNN và Random Forest</h3>
                    <p>Python, 2025.</p>
                </article>
            </section>
            
            <section id="contact">
                <h2>Liên hệ</h2>
                <form>
                    <label for="name">Họ tên</label>
                    <input id="name" 
                        name="name" required>
                    <label for="email">Email</label>
                    <input id="email" type="email"
                        name="email" required>
                    <label for="msg">Lời nhắn</label>
                    <textarea id="msg" name="msg"></textarea>
                    <button>Gửi</button>
                </form>
            </section>
        </main>
        <footer> © 2026 Nguyễn Thị Mai Linh.</footer>

</html>
